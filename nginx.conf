events { worker_connections 1024; }

http {
    upstream app_cluster {
        server app-01:3000;
        server app-02:3000;
        server app-03:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}